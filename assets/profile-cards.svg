<svg xmlns="http://www.w3.org/2000/svg" width="850" height="750" viewBox="0 0 850 750" fill="none">
  <style>
    .title { font: 600 20px 'Segoe UI', Inter, -apple-system, sans-serif; fill: #e6edf3; }
    .subtitle { font: 400 12px 'Segoe UI', Inter, -apple-system, sans-serif; fill: #8b949e; }
    .subhead { font: 600 13px 'Segoe UI', Inter, -apple-system, sans-serif; fill: #e6edf3; }
    .label { font: 400 12px 'Segoe UI', Inter, -apple-system, sans-serif; fill: #c9d1d9; }
    .pct { font: 400 11px 'Segoe UI', Inter, -apple-system, sans-serif; fill: #c9d1d9; text-anchor: middle; }
    .day { font: 400 11px 'Segoe UI', Inter, -apple-system, sans-serif; fill: #8b949e; text-anchor: middle; }
    .repo-title { font: 600 14px 'Segoe UI', Inter, -apple-system, sans-serif; fill: #e6edf3; }
    .repo-meta { font: 400 11px 'Segoe UI', Inter, -apple-system, sans-serif; fill: #8b949e; text-anchor: end; }
    .repo-desc { font: 400 12px 'Segoe UI', Inter, -apple-system, sans-serif; fill: #8b949e; }
    .stack-txt { font: 500 11px 'Segoe UI', Inter, -apple-system, sans-serif; fill: #c9d1d9; }
  </style>

  <!-- ==================== 1. TOP LANGUAGES & CORE STACK ==================== -->
