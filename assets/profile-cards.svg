  <circle cx="240" cy="105" r="5" fill="#61dafb" /><text x="253" y="109" class="label">React / Next.js</text><text x="385" y="109" class="label">22.5%</text>
  <circle cx="470" cy="105" r="5" fill="#38bdf8" /><text x="483" y="109" class="label">Tailwind CSS</text><text x="605" y="109" class="label">11.2%</text>
  <circle cx="690" cy="105" r="5" fill="#336791" /><text x="703" y="109" class="label">PostgreSQL</text><text x="800" y="109" class="label">6.3%</text>

